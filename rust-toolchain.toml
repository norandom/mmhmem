[toolchain]
# Pinned stable channel (matches the installed rustc 1.98.1); see design.md
# "Technology Stack" — Rust stable via rust-toolchain.toml.
channel = "stable"
# Project-local components: rust-analyzer for code review (requested by reviewer),
# rust-src for go-to-definition, plus the lint/format tools used by scripts/lint.ps1.
components = ["rust-analyzer", "rust-src", "clippy", "rustfmt"]
