[package]
name = "mmhmem"
version = "0.5.4"
edition = "2024"
description = "Self-hosted cross-agent memory and I/O optimization server for AI coding harnesses (remote MCP Streamable HTTP daemon)"
publish = false

# Runtime dependencies — exact-pinned per design.md "Technology Stack" and
# research.md "Minimal dependency set" (research risk 2: pin exact versions;
# Cargo.lock is committed on top).
[dependencies]
# Official MCP Rust SDK; the Streamable HTTP server transport feature is
# `transport-streamable-http-server` in rmcp 3.x; `transport-io` adds the
# stdio transport for local mode (local-mode Req 2.1; design.md
# "Technology Stack"). `client` + `transport-child-process` drive the
# installer's functional check (reliable-installers task 4.1).
rmcp = { version = "=3.8.0", features = ["transport-streamable-http-server", "transport-io", "client", "transport-child-process"] }
# Embedded SQLite (WAL + FTS5) compiled into the binary; no system libsqlite3.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
# Async runtime.
tokio = { version = "=1.54.1", features = ["full"] }
# HTTP binding for the rmcp Streamable HTTP service (task 10.1; design.md
# "Technology Stack": axum via the rmcp transport).
axum = "=0.8.9"
# Cancellation token for graceful shutdown (same version rmcp uses).
tokio-util = "=0.7.20"
# The only HTTP egress: the worker-model endpoint (rustls, no default/native TLS).
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Content hashes + audit record digests.
sha2 = "=0.11.1"
# Constant-time bearer-token comparison.
subtle = "=2.6.1"
# Redaction filter + security-critical path pattern.
regex = "=1.13.1"
# ISO-8601 UTC timestamps in audit records.
time = { version = "=0.3.55", features = ["formatting"] }
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# Optional OTel export (Req 11.2, task 9.1): compiled ONLY with
# `--features otel` (the Docker image). The plain release binary contains no
# OTLP code path (verified via `cargo tree -e normal` having zero opentelemetry
# crates). http-proto + reqwest-rustls reuses the pinned rustls reqwest.
opentelemetry = { version = "=0.33.1", optional = true }
opentelemetry_sdk = { version = "=0.33.1", optional = true, features = ["experimental_async_runtime", "rt-tokio"] }
opentelemetry-otlp = { version = "=0.33.1", optional = true, default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-client", "reqwest-rustls"] }

# `mmhmem setup` (reliable-installers; research.md §6 has the per-task table).
# Same-folder temp file + rename for atomic config writes (task 2.1).
tempfile = "=3.27.0"
# IO errors that name the file (task 2.1).
fs-err = "=3.3.2"
# Comment- and format-preserving JSON/JSONC edits (task 2.2).
jsonc-parser = { version = "=0.34.0", features = ["cst"] }
# Format-preserving TOML edits for Codex config.toml (task 2.3).
toml_edit = "=0.25.18"
# Review-screen diffs (task 2.5).
similar = "=3.2.1"
# Agent detection and per-OS state/config folders (task 3.1).
which = "=8.0.6"
etcetera = "=0.11.0"
# Release download, zipsign signature check, unpack and self-replace
# (tasks 5.4, 7.1). rustls only, no default features, no progress bar
# (indicatif is pinned separately).
self_update = { version = "=1.3.3", default-features = false, features = ["reqwest", "rustls", "github", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate", "signatures", "checksums"] }
# Detached SHA256SUMS signature (task 5.4), same key format as the archives.
zipsign-api = { version = "=0.2.2", default-features = false, features = ["verify-tar", "verify-zip"] }
# Full-screen menu (task 6.2): only the crossterm backend, no default widgets
# or macros (research.md §11).
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"
indicatif = "=0.18.6"
# Removal deletes the running program on Windows after it exits (task 7.2);
# the same version self_update uses.
self-replace = "=1.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
# The bootstrap starts setup with stdin from /dev/tty; macOS kqueue rejects
# /dev/tty (EINVAL, tokio-rs/mio#1377), so crossterm's default mio reader
# cannot read keys there. use-dev-tty reads with select() instead
# (research.md §8).
crossterm = { version = "=0.29.0", features = ["use-dev-tty"] }

[target.'cfg(windows)'.dependencies]
# Current-user PATH entry (task 7.1).
winreg = "=0.56.0"
# Owner-only key file: CreateFileW with a current-user-only DACL (task 2.1).
# ToolHelp: is the installed program still running elsewhere (removal).
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "=3.27.0"
insta = "=1.49.0"
assert_fs = "=1.1.4"
httpmock = "=0.9.0"
# Signing side of the update spike (task 1.4); production only verifies.
zipsign-api = { version = "=0.2.2", default-features = false, features = ["sign-zip", "sign-tar"] }
zip = { version = "=9.3.0", default-features = false, features = ["deflate"] }

[features]
# Optional OTel export (Req 11.2): compiled only into the Docker image, off by
# default in the plain release binary.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]

# Installer end-to-end job only (.github/workflows/installer-e2e.yml, task
# 8.2): also trust the ephemeral release key given at build time in
# MMHMEM_E2E_RELEASE_PUBLIC_KEY (64 hex characters). NEVER enabled for
# release builds; scripts/publish-ci-release.ps1 refuses binaries built with it.
e2e-release-key = []

# Req 13.1/13.2: make the complexity cap BLOCKING under the canonical gate
# command `cargo clippy --all-targets -- -D warnings`. On the pinned toolchain
# (clippy 0.1.98) cognitive-complexity is allow-by-default (restriction group),
# so -D warnings alone would not enforce it; promote it to warn here. The
# threshold itself lives in clippy.toml (cognitive-complexity-threshold = 15).
[lints.clippy]
cognitive-complexity = "warn"
