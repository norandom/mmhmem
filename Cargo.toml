[package]
name = "mmhmem"
version = "0.3.3"
edition = "2024"
description = "Self-hosted cross-agent memory and I/O optimization server for AI coding harnesses (remote MCP Streamable HTTP daemon)"
publish = false

# Runtime dependencies — exact-pinned per design.md "Technology Stack" and
# research.md "Minimal dependency set" (research risk 2: pin exact versions;
# Cargo.lock is committed on top).
[dependencies]
# Official MCP Rust SDK; the Streamable HTTP server transport feature is
# `transport-streamable-http-server` in rmcp 3.x; `transport-io` adds the
# stdio transport for local mode (local-mode Req 2.1; design.md
# "Technology Stack").
rmcp = { version = "=3.8.0", features = ["transport-streamable-http-server", "transport-io"] }
# Embedded SQLite (WAL + FTS5) compiled into the binary; no system libsqlite3.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
# Async runtime.
tokio = { version = "=1.54.1", features = ["full"] }
# HTTP binding for the rmcp Streamable HTTP service (task 10.1; design.md
# "Technology Stack": axum via the rmcp transport).
axum = "=0.8.9"
# Cancellation token for graceful shutdown (same version rmcp uses).
tokio-util = "=0.7.20"
# The only HTTP egress: the worker-model endpoint (rustls, no default/native TLS).
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Content hashes + audit record digests.
sha2 = "=0.11.1"
# Constant-time bearer-token comparison.
subtle = "=2.6.1"
# Redaction filter + security-critical path pattern.
regex = "=1.13.1"
# ISO-8601 UTC timestamps in audit records.
time = { version = "=0.3.55", features = ["formatting"] }
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# Optional OTel export (Req 11.2, task 9.1): compiled ONLY with
# `--features otel` (the Docker image). The plain release binary contains no
# OTLP code path (verified via `cargo tree -e normal` having zero opentelemetry
# crates). http-proto + reqwest-rustls reuses the pinned rustls reqwest.
opentelemetry = { version = "=0.33.1", optional = true }
opentelemetry_sdk = { version = "=0.33.1", optional = true, features = ["experimental_async_runtime", "rt-tokio"] }
opentelemetry-otlp = { version = "=0.33.1", optional = true, default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-client", "reqwest-rustls"] }

[dev-dependencies]
tempfile = "=3.27.0"

[features]
# Optional OTel export (Req 11.2): compiled only into the Docker image, off by
# default in the plain release binary.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]

# Req 13.1/13.2: make the complexity cap BLOCKING under the canonical gate
# command `cargo clippy --all-targets -- -D warnings`. On the pinned toolchain
# (clippy 0.1.98) cognitive-complexity is allow-by-default (restriction group),
# so -D warnings alone would not enforce it; promote it to warn here. The
# threshold itself lives in clippy.toml (cognitive-complexity-threshold = 15).
[lints.clippy]
cognitive-complexity = "warn"
