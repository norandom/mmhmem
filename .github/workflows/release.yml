name: Publish release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish from its successful main CI and installer e2e runs
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  # Pinned signing CLI; scripts/sign-release-assets.ps1 refuses any other version.
  ZIPSIGN_VERSION: '0.2.2'

jobs:
  # No secrets and no environment here: decide whether anything needs publishing
  # so that the approval-gated `release` environment is only entered for tags.
  plan:
    if: github.repository == 'norandom/mmhmem' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          publish=false
          if [ "$EVENT" != workflow_run ]; then
            publish=true
          elif git tag --points-at "$RUN_SHA" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: windows-latest
    # Up to 30 min waiting for CI plus up to 30 min for installer e2e (both
    # start on the same push, so the waits usually overlap), then the build.
    timeout-minutes: 90
    # The signing key exists only as a secret of this environment, which must
    # have required reviewers (docs/release-signing.md).
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write       # build provenance attestation (OIDC)
      attestations: write   # build provenance attestation
    steps:
      # Always execute trusted default-branch publication code. Binaries come
      # exclusively from the exact tagged commit's successful main CI run.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install pinned zipsign
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'zipsign'
          cargo install zipsign --version "=$env:ZIPSIGN_VERSION" --locked --root $root
          if ($LASTEXITCODE -ne 0) { throw 'zipsign install failed' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $root 'bin')
      - name: Validate publisher regressions
        shell: pwsh
        run: |
          ./scripts/test-publish-linux-release.ps1
          ./scripts/test-package-release-archives.ps1
          ./scripts/test-sign-release-assets.ps1
          ./scripts/test-publish-ci-release.ps1
      # Requires green main CI AND a green installer e2e gate (push run of
      # installer-e2e.yml, job `installer-e2e`) for the exact tag commit, waiting
      # for either if it is still running. Signs, uploads and re-verifies every
      # asset, and leaves the release a DRAFT. No outputs when already published.
      - name: Build and verify the draft release
        id: draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          SOURCE_RUN: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          # Only this step sees the key (secret of the `release` environment).
          MMHMEM_RELEASE_SIGNING_KEY: ${{ secrets.MMHMEM_RELEASE_SIGNING_KEY }}
        run: ./scripts/publish-ci-release.ps1 -Tag $env:RELEASE_TAG -RunId $env:SOURCE_RUN
      # Provenance for the exact signed archive bytes in the draft.
      # actions/attest-build-provenance v4.2.2
      - name: Attest archives
        if: steps.draft.outputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ steps.draft.outputs.archives }}
      # Last step: runs only when signing, upload verification and attestation
      # succeeded. Re-checks the tag, both gates and the exact draft asset set.
      - name: Publish the draft release
        if: steps.draft.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.draft.outputs.tag }}
          RELEASE_REVISION: ${{ steps.draft.outputs.revision }}
          SOURCE_RUN: ${{ steps.draft.outputs.ci_run }}
          RELEASE_ASSETS: ${{ steps.draft.outputs.assets }}
        run: ./scripts/publish-ci-release.ps1 -PublishDraft -Tag $env:RELEASE_TAG -RunId $env:SOURCE_RUN -DraftRevision $env:RELEASE_REVISION -DraftAssets $env:RELEASE_ASSETS
