# Installer end-to-end gate (reliable-installers tasks 8.1 and 8.2;
# Requirement 10).
#
# Proves the installer like a real user install: the commit's binaries are
# packaged, signed, hashed and rendered into install.sh / install.ps1 by the
# SAME scripts the release uses (scripts/e2e-run.ps1 -Phase release calls
# package-release-archives.ps1, sign-release-assets.ps1 and
# render-bootstraps.ps1 -BaseUrl), served from a local HTTP server, and the
# exact user one-liner is run in a clean, seeded home with the real agent
# CLIs installed from their official npm packages.
#
# Jobs
#   keygen  ephemeral zipsign key pair for this run only (never a release
#           key; the private half lives one day as an artifact of this run)
#   build   the commit's four binaries, built in-job (see "Binaries" below),
#           and the same commit built as the previous version (Cargo version
#           minus one patch) for the update scenario
#   package archives -> signatures -> bootstraps -> SHA256SUMS(.sig) for this
#           version, the previous version, and this version signed by a
#           second throwaway key (the bad-signature scenario)
#   e2e     ubuntu-latest, macos-15 (arm64), macos-15-intel (x86_64),
#           windows-latest x {Windows PowerShell 5.1, PowerShell 7}: every
#           scenario of scripts/e2e-scenarios.ps1, one step each, in order
#   installer-e2e  one required status for branch protection and for the
#           release gate (task 8.3): scripts/publish-ci-release.ps1 publishes
#           a tag only when the newest PUSH run of this workflow on main for
#           the tag commit succeeded with this job green. workflow_dispatch
#           runs (sabotage) and pull_request runs never count.
#
# Binaries are built here rather than reused from ci.yml's artifacts:
#   - the update scenarios (task 8.2) verify signatures, and the production
#     key list in src/setup/release_keys.rs is empty, so the e2e build must
#     trust the ephemeral key generated by `keygen`. That needs a build-time
#     input, and ci.yml's binaries (the ones that get published) must never
#     carry it;
#   - the release gate (task 8.3) only reads this workflow's result; it
#     never publishes these binaries, which trust a test key.
#   The price is a second build per commit, softened by the cargo caches.
#
# Test-key mechanism (src/setup/release_keys.rs):
#   cargo feature `e2e-release-key` (off by default) makes the binary trust
#   one extra key, read at compile time from MMHMEM_E2E_RELEASE_PUBLIC_KEY
#   (64 hex characters; env! so a missing value is a compile error, and a
#   const decode so a malformed one is too). Such a build carries the marker
#   bytes "mmhmem-e2e-release-key-build"; `build` checks they are there, and
#   scripts/publish-ci-release.ps1 refuses to publish any binary with them.
#
# Menu path: ci/e2e/pty-driver, a small test-only Rust program built on each
#   e2e runner, runs the one-liner (or `mmhmem setup`) in a pseudo-terminal
#   (openpty on Linux/macOS, ConPTY on Windows, via portable-pty), keeps a
#   vt100 model of the screen and follows a script of "expect this text,
#   press these keys" steps, so the real full-screen menu is driven exactly
#   as a user would and its exit code is the program's.
#
# Proving the gate: run this workflow by hand (workflow_dispatch) with
#   sabotage=wrong-hash. The bootstraps are then rendered with a wrong
#   SHA-256 and the job must fail.
#
# Isolation
#   Linux/macOS: fresh HOME and TMPDIR under $RUNNER_TEMP; XDG_*,
#     CLAUDE_CONFIG_DIR and CODEX_HOME removed so every tool derives its
#     paths from HOME, as on a user's machine.
#   Windows: a fresh local profile needs admin rights and a logon, so the
#     profile variables (USERPROFILE, HOME, HOMEDRIVE/HOMEPATH, APPDATA,
#     LOCALAPPDATA, TEMP/TMP) point into the clean home and CODEX_HOME is set
#     explicitly (codex.exe may resolve the profile through the Known Folder
#     API). HKCU is still the runner's: setup writes HKCU\Environment\Path,
#     so `seed` snapshots that value and compare-seed checks it. Runners are
#     disposable, so nothing else of the runner's registry is protected.
#
# Pins: every action by full commit SHA; Rust, zipsign, Node.js and the
# three agent CLIs by exact version (env below).

name: Installer e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      sabotage:
        description: 'none, or wrong-hash: render the bootstraps with a wrong SHA-256 (the job must then fail)'
        type: choice
        options: [none, wrong-hash]
        default: none

permissions:
  contents: read

concurrency:
  group: installer-e2e-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.98.1'
  # scripts/sign-release-assets.ps1 refuses any other zipsign version.
  ZIPSIGN_VERSION: '0.2.2'
  NODE_VERSION: '24.22.1'
  CLAUDE_CODE_VERSION: '2.1.311'   # npm @anthropic-ai/claude-code (dist-tag "stable")
  CODEX_VERSION: '0.166.0'         # npm @openai/codex
  OPENCODE_VERSION: '2.2.5'        # npm @opencode/cli (OpenCode 2.x, research.md section 8)
  # The bootstraps are rendered once (job `package`) for this loopback port.
  E2E_PORT: '47801'
  # Every scenario blocks. 'false' (only for an emergency, with a reason in
  # the commit) would let the install/assert steps report without blocking.
  E2E_SCENARIOS_ENFORCED: 'true'

jobs:
  keygen:
    name: Ephemeral release key
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      public_key: ${{ steps.key.outputs.public_key }}
      tag: ${{ steps.meta.outputs.tag }}
      old_version: ${{ steps.meta.outputs.old_version }}
      old_tag: ${{ steps.meta.outputs.old_tag }}
      e2e_feature: ${{ steps.meta.outputs.e2e_feature }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: meta
        name: Release tag and test-key feature
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # The previous version: one patch lower (x.y.0 -> x.(y-1).999).
          IFS=. read -r major minor patch <<< "$version"
          if [ "$patch" -gt 0 ]; then old="$major.$minor.$((patch - 1))"
          elif [ "$minor" -gt 0 ]; then old="$major.$((minor - 1)).999"
          else old="$((major - 1)).999.999"; fi
          echo "old_version=$old" >> "$GITHUB_OUTPUT"
          echo "old_tag=v$old" >> "$GITHUB_OUTPUT"
          if grep -Eq '^e2e-release-key[[:space:]]*=' Cargo.toml; then
            echo "e2e_feature=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e_feature=false" >> "$GITHUB_OUTPUT"
          fi
      # actions/cache v6.1.0
      - name: Restore the pinned zipsign
        id: zipsign-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/mmhmem-e2e/zipsign
          key: zipsign-${{ env.ZIPSIGN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the pinned zipsign (cache miss only)
        if: steps.zipsign-cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install zipsign --version "=$ZIPSIGN_VERSION" --locked --root ~/.cache/mmhmem-e2e/zipsign
      - id: key
        name: Generate the ephemeral key pair
        shell: pwsh
        run: |
          $env:ZIPSIGN = Join-Path $HOME '.cache/mmhmem-e2e/zipsign/bin/zipsign'
          ./scripts/e2e-run.ps1 -Phase keygen -KeyFile (Join-Path $env:RUNNER_TEMP 'e2e-key/ephemeral.key')
      # actions/upload-artifact v7.0.2
      - name: Hand the private key to the package job (this run only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-ephemeral-signing-key
          path: ${{ runner.temp }}/e2e-key/
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: keygen
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: mmhmem
            asset: mmhmem-linux-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe: mmhmem.exe
            asset: mmhmem.exe
          - runner: macos-15
            target: aarch64-apple-darwin
            exe: mmhmem
            asset: mmhmem-macos-aarch64
          - runner: macos-15
            target: x86_64-apple-darwin
            exe: mmhmem
            asset: mmhmem-macos-x86_64
    env:
      # Same value as env.RUST_TOOLCHAIN (the env context is not available here).
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      MMHMEM_E2E_RELEASE_PUBLIC_KEY: ${{ needs.keygen.outputs.public_key }}
      E2E_FEATURE: ${{ needs.keygen.outputs.e2e_feature }}
      OLD_VERSION: ${{ needs.keygen.outputs.old_version }}
      TARGET: ${{ matrix.target }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} for ${{ matrix.target }}
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
      - name: musl toolchain (same settings as the Dagger static_release)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          {
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc"
            echo "CC_x86_64_unknown_linux_musl=musl-gcc"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C target-feature=+crt-static -C target-cpu=x86-64 -C link-arg=-Wl,--no-dynamic-linker"
          } >> "$GITHUB_ENV"
      # actions/cache/restore v6.1.0
      - name: Restore cargo registry and target
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-cargo-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            e2e-cargo-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Release build with the ephemeral key trusted
        shell: bash
        run: |
          if [ "$E2E_FEATURE" != true ]; then
            echo "::error::Cargo.toml has no e2e-release-key feature; the update scenarios need it."
            exit 1
          fi
          cargo build --release --locked --target "$TARGET" --features e2e-release-key
          mkdir -p dist
          cp "target/$TARGET/release/${{ matrix.exe }}" "dist/${{ matrix.asset }}"
          # The marker the publisher refuses (src/setup/release_keys.rs).
          grep -aq 'mmhmem-e2e-release-key-build' "dist/${{ matrix.asset }}"
      # Same commit, older version number: the update scenario installs this
      # one first. Only the mmhmem crate itself is rebuilt.
      - name: Release build of the previous version (Cargo version ${{ needs.keygen.outputs.old_version }})
        shell: pwsh
        run: |
          $toml = [IO.File]::ReadAllText('Cargo.toml')
          $current = [regex]::Match($toml, '(?m)^version = "([0-9.]+)"').Groups[1].Value
          if (-not $current -or -not $env:OLD_VERSION) { throw 'no version' }
          $toml = ([regex]'(?m)^version = "[0-9.]+"').Replace($toml, "version = `"$env:OLD_VERSION`"", 1)
          $lock = [IO.File]::ReadAllText('Cargo.lock')
          $entry = [regex]('(name = "mmhmem"\r?\nversion = ")' + [regex]::Escape($current) + '"')
          if (-not $entry.IsMatch($lock)) { throw 'mmhmem is not in Cargo.lock' }
          $lock = $entry.Replace($lock, '${1}' + $env:OLD_VERSION + '"', 1)
          [IO.File]::WriteAllText('Cargo.toml', $toml)
          [IO.File]::WriteAllText('Cargo.lock', $lock)
          try {
            cargo build --release --locked --target $env:TARGET --features e2e-release-key
            if ($LASTEXITCODE -ne 0) { throw 'the previous-version build failed' }
          } finally {
            git checkout -- Cargo.toml Cargo.lock
          }
          New-Item -ItemType Directory -Path dist-old -Force | Out-Null
          Copy-Item "target/$env:TARGET/release/${{ matrix.exe }}" "dist-old/${{ matrix.asset }}"
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-bin-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 3
          if-no-files-found: error
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-oldbin-${{ matrix.asset }}
          path: dist-old/${{ matrix.asset }}
          retention-days: 3
          if-no-files-found: error
      # actions/cache/save v6.1.0 - push only, so pull requests cannot
      # overwrite main's caches; success() so a failed build never persists.
      - name: Save cargo registry and target
        if: success() && github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  package:
    name: Package, sign and render
    needs: [keygen, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/download-artifact v8.0.2
      - name: Download the four binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: e2e-bin-*
          merge-multiple: true
          path: ${{ runner.temp }}/e2e-bin
      # actions/download-artifact v8.0.2
      - name: Download the four previous-version binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: e2e-oldbin-*
          merge-multiple: true
          path: ${{ runner.temp }}/e2e-bin-old
      # actions/download-artifact v8.0.2
      - name: Download the ephemeral key
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: e2e-ephemeral-signing-key
          path: ${{ runner.temp }}/e2e-key
      # actions/cache/restore v6.1.0 (saved by `keygen`)
      - name: Restore the pinned zipsign
        id: zipsign-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/mmhmem-e2e/zipsign
          key: zipsign-${{ env.ZIPSIGN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the pinned zipsign (cache miss only)
        if: steps.zipsign-cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install zipsign --version "=$ZIPSIGN_VERSION" --locked --root ~/.cache/mmhmem-e2e/zipsign
      - name: Archives, signatures, bootstraps for the local URL, SHA256SUMS(.sig)
        shell: pwsh
        env:
          TAG: ${{ needs.keygen.outputs.tag }}
          OLD_TAG: ${{ needs.keygen.outputs.old_tag }}
          SABOTAGE: ${{ inputs.sabotage }}
        run: |
          $env:ZIPSIGN = Join-Path $HOME '.cache/mmhmem-e2e/zipsign/bin/zipsign'
          $key = Join-Path $env:RUNNER_TEMP 'e2e-key/ephemeral.key'
          # A second throwaway key, never trusted by any build: bad-signature.
          $other = Join-Path $env:RUNNER_TEMP 'e2e-other-key/other.key'
          $bin = Join-Path $env:RUNNER_TEMP 'e2e-bin'
          $port = [int]$env:E2E_PORT
          try {
            ./scripts/e2e-run.ps1 -Phase release -Role current -Tag $env:TAG -Port $port `
              -BinaryDirectory $bin -KeyFile $key -BreakHash:($env:SABOTAGE -eq 'wrong-hash')
            ./scripts/e2e-run.ps1 -Phase release -Role old -Tag $env:OLD_TAG -Port $port `
              -BinaryDirectory (Join-Path $env:RUNNER_TEMP 'e2e-bin-old') -KeyFile $key
            ./scripts/e2e-run.ps1 -Phase keygen -KeyFile $other
            ./scripts/e2e-run.ps1 -Phase release -Role badsig -Tag $env:TAG -Port $port `
              -BinaryDirectory $bin -KeyFile $other
          } finally {
            Remove-Item -LiteralPath $key, $other -Force -ErrorAction SilentlyContinue
          }
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-release-site
          path: ${{ runner.temp }}/mmhmem-e2e/site/
          retention-days: 3
          if-no-files-found: error

  e2e:
    name: e2e ${{ matrix.name }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            shell: pwsh
          # The spec names macos-14 and macos-13: GitHub retired macOS 13 in
          # 2025 and every macOS 14 image on 2026-11-02 (runner-images README,
          # issue 15226). macos-15 / macos-15-intel are the same two CPUs.
          - name: macos-arm64
            runner: macos-15
            shell: pwsh
          - name: macos-x86_64
            runner: macos-15-intel
            shell: pwsh
          - name: windows-powershell-5.1
            runner: windows-latest
            shell: powershell
          - name: windows-pwsh-7
            runner: windows-latest
            shell: pwsh
    # The phases run under the matrix shell: powershell.exe 5.1 or pwsh 7.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      # npm 11 runs install scripts only for packages listed here; older npm ignores it.
      npm_config_allow_scripts: '@anthropic-ai/claude-code,@opencode/cli'
      DISABLE_AUTOUPDATER: '1'
      OPENCODE_DISABLE_AUTOUPDATE: 'true'
      # The pty driver's toolchain (same value as env.RUST_TOOLCHAIN; it also
      # overrides rust-toolchain.toml's channel).
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # runner.temp is not available in job-level env.
      - name: Work folders
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MMHMEM_E2E_WORKDIR=$(Join-Path $env:RUNNER_TEMP 'mmhmem-e2e')"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "AGENT_CLI_PREFIX=$(Join-Path $env:RUNNER_TEMP 'agent-clis')"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PTY_TARGET=$(Join-Path $env:RUNNER_TEMP 'pty-target')"
      - name: Harness logic tests (no installer)
        run: ./scripts/test-e2e-harness.ps1
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} for the pty driver
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      # actions/cache v6.1.0
      - name: Restore the pty driver build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ${{ env.PTY_TARGET }}
          key: e2e-pty-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('ci/e2e/pty-driver/Cargo.lock', 'ci/e2e/pty-driver/src/**') }}
          restore-keys: |
            e2e-pty-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Build the pty driver (ci/e2e/pty-driver)
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path ci/e2e/pty-driver/Cargo.toml --target-dir $env:PTY_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'the pty driver did not build' }
          cargo test --release --locked --manifest-path ci/e2e/pty-driver/Cargo.toml --target-dir $env:PTY_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'the pty driver tests failed' }
          $exe = Join-Path $env:PTY_TARGET ('release/mmhmem-e2e-pty' + $(if ($IsWindows) { '.exe' } else { '' }))
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MMHMEM_E2E_PTY=$exe"
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Pinned packages only, so caching the installed prefix is safe.
      # actions/cache v6.1.0
      - name: Restore the agent CLIs
        id: cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.AGENT_CLI_PREFIX }}
          key: agent-clis-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-claude${{ env.CLAUDE_CODE_VERSION }}-codex${{ env.CODEX_VERSION }}-opencode${{ env.OPENCODE_VERSION }}
      - name: Install claude, codex and opencode from npm (cache miss only)
        if: steps.cli-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          npm install -g --prefix $env:AGENT_CLI_PREFIX --no-fund --no-audit `
            "@anthropic-ai/claude-code@$env:CLAUDE_CODE_VERSION" `
            "@openai/codex@$env:CODEX_VERSION" `
            "@opencode/cli@$env:OPENCODE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
      - name: Put the agent CLIs on PATH
        shell: pwsh
        run: |
          $bin = if ($IsWindows) { $env:AGENT_CLI_PREFIX } else { Join-Path $env:AGENT_CLI_PREFIX 'bin' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin
      # Runs in the runner's own home, never the clean one.
      - name: Agent CLI versions
        shell: pwsh
        run: |
          claude --version; codex --version; opencode --version
          if ($LASTEXITCODE -ne 0) { throw 'an agent CLI does not start' }
      # actions/download-artifact v8.0.2
      - name: Download the e2e release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: e2e-release-site
          path: ${{ env.MMHMEM_E2E_WORKDIR }}/site
      - name: Seed a clean home (manifest of the seeded bytes)
        run: ./scripts/e2e-run.ps1 -Phase seed
      - name: Serve the release on 127.0.0.1
        run: ./scripts/e2e-run.ps1 -Phase serve
      - name: The pseudo-terminal types into a shell and reads the answer
        run: ./scripts/e2e-run.ps1 -Phase pty-selftest
      # Failure cases first, on the fresh home: each leaves it unchanged.
      - name: Cancel at the Review screen (menu, q) changes nothing
        run: ./scripts/e2e-run.ps1 -Phase cancel-at-review
      - name: A missing archive (HTTP 404) changes nothing
        run: ./scripts/e2e-run.ps1 -Phase download-404
      - name: A wrong built-in SHA-256 changes nothing
        run: ./scripts/e2e-run.ps1 -Phase bad-hash
      - name: Install with the exact one-liner, no terminal (default choices)
        continue-on-error: ${{ env.E2E_SCENARIOS_ENFORCED != 'true' }}
        run: ./scripts/e2e-run.ps1 -Phase install
      - name: Installed, every check passed, unrelated seeded files byte-identical
        continue-on-error: ${{ env.E2E_SCENARIOS_ENFORCED != 'true' }}
        run: ./scripts/e2e-run.ps1 -Phase assert-installed
      - name: Run again - Everything is current, home unchanged
        run: ./scripts/e2e-run.ps1 -Phase rerun
      - name: Remove through the menu - program, record and PATH entry gone, memories kept
        run: ./scripts/e2e-run.ps1 -Phase remove
      - name: After removal the seeded files are byte-identical to the seed
        run: ./scripts/e2e-run.ps1 -Phase compare-seed
      - name: Fresh home for the menu install
        run: ./scripts/e2e-run.ps1 -Phase seed
      - name: Install through the full-screen menu in a pseudo-terminal
        run: ./scripts/e2e-run.ps1 -Phase menu-install
      - name: Menu install - every check passed, unrelated seeded files byte-identical
        run: ./scripts/e2e-run.ps1 -Phase assert-installed -Run menu-install
      - name: Fresh home for the update
        run: ./scripts/e2e-run.ps1 -Phase seed
      - name: Install the previous version with its one-liner
        run: ./scripts/e2e-run.ps1 -Phase install-old
      - name: An update signed by another key is refused and changes nothing
        run: ./scripts/e2e-run.ps1 -Phase bad-signature
      - name: Update through the menu - new program recorded, choices kept, checks pass
        run: ./scripts/e2e-run.ps1 -Phase update
      - name: Fresh home for the update command
        run: ./scripts/e2e-run.ps1 -Phase seed
      - name: Install the previous version again with its one-liner
        run: ./scripts/e2e-run.ps1 -Phase install-old
      - name: Update with mmhmem update - new program recorded, choices kept, checks pass
        run: ./scripts/e2e-run.ps1 -Phase update-command
      - name: Fresh home with an invalid opencode.json
        run: ./scripts/e2e-run.ps1 -Phase seed
      - name: Invalid opencode.json - only OpenCode skipped, the others installed
        run: ./scripts/e2e-run.ps1 -Phase invalid-config
      # Diagnostics only: what the real `claude mcp get/list` answer for a
      # throwaway mmhmem entry in a separate isolated home (no installer runs;
      # env values are masked). Evidence for research.md §8, never a pass.
      - name: Agent CLI diagnostics (only after a failure)
        if: failure()
        continue-on-error: true
        run: ./scripts/e2e-run.ps1 -Phase agent-diagnostics
      - name: Stop the server
        if: always()
        run: ./scripts/e2e-run.ps1 -Phase stop
      # Logs and the manifest only: never the home (it may hold agent state).
      # actions/upload-artifact v7.0.2
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-logs-${{ matrix.name }}
          path: |
            ${{ env.MMHMEM_E2E_WORKDIR }}/logs/
            ${{ env.MMHMEM_E2E_WORKDIR }}/seed-manifest.sha256
          retention-days: 7
          if-no-files-found: ignore

  installer-e2e:
    name: installer-e2e
    needs: [keygen, build, package, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then exit 1; fi
          done
