# mmhmem CI (task 14.1; Req 13.1, 13.2, 13.5, 13.6, 11.2, 8.6, 8.7, 12.3).
#
# One Dagger module (ci/) runs everywhere: locally via the WSL dagger CLI
# (`cd ci && dagger call all`) and here in GitHub Actions with the
# same entrypoints — never two scripts (dev-environment steering).
# The module loads the repo from its parent dir with excludes
# (target/, .git, secrets) — no --src argument is needed.
#
# quality-gates (blocking): fmt, clippy -D warnings (default AND
# --features otel — gated code escapes plain clippy), the deterministic
# suite (incl. tests/loc_caps.rs, which machine-enforces the Req 13.3 size
# caps), release build, Docker image built with the otel feature whose
# payload runs, `docker compose config` on prod + e2e stacks, and pristine
# systemd-analyze/logrotate validation; tokei LOC report informational.
# The gate runs `all --concurrency=3 --cargo-jobs=4` (local defaults stay 1
# and 2); the export step must pass the same --cargo-jobs so the engine
# reuses the in-session musl build. An always-run step writes the per-stage
# timing table (ci/scripts/timing_summary.py) to the job summary.
#
# e2e-measurement (optional, model-gated; Req 12): enable by setting the
# repository variable E2E_LLM_ENABLED=true plus the secrets
# E2E_WORKER_API_URL and E2E_WORKER_MODEL (optional E2E_WORKER_API_KEY)
# and whatever provider-credential secrets the OpenCode harness reads
# (ANTHROPIC_API_KEY / OPENAI_API_KEY / OPENROUTER_API_KEY / MISTRAL_API_KEY).
# It runs the E2E_LLM=1 suite over docker compose on the runner and uploads
# the measured-savings report as an artifact.
#
# windows + macos (local-mode Req 10.1-10.5): native-runner jobs for the
# platforms the Linux containers cannot build — the canonical MSVC and
# Apple toolchains do not run in Docker, and cfg(windows)/cfg(macos) code
# must not escape the blocking lint gate (Req 10.4). The gate commands are
# identical to the container pipeline; this is the documented, deliberate
# exception to "one pipeline, never two scripts" (design.md "Cross-platform
# pipeline"; research.md "Cross-platform release builds"). All container
# work stays single-sourced in the Dagger module.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Preserve an older commit's in-flight release candidates when main moves.
  # Reruns of the same commit can still supersede one another.
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Blocking quality gates (Dagger)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Capture clean checkout provenance
        id: provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "validation_id=ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: musl clippy, tests and release, otel clippy, fmt, docker image, compose config, deploy artifacts, tokei
        id: gate
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.11"
          workdir: ci
          # v8.4.1 of the action prefixes `dagger call` itself — the args
          # carry only the function invocation. A fresh checkout carries
          # no target/.git — the --src contract.
          args: all --src .. --revision=${{ steps.provenance.outputs.revision }} --validation-id=${{ steps.provenance.outputs.validation_id }} --source-clean=true --concurrency=3 --cargo-jobs=4
      - name: Write per-stage gate timings to the job summary
        if: always()
        env:
          GATE_OUTPUT: ${{ steps.gate.outputs.output }}
        run: python3 ci/scripts/timing_summary.py
      - name: Export the same verified Linux bundle
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.11"
          workdir: ci
          args: static-release --src .. --revision=${{ steps.provenance.outputs.revision }} --validation-id=${{ steps.provenance.outputs.validation_id }} --source-clean=true --cargo-jobs=4 export --path=../tmp/linux-static
      - name: Upload verified Linux bundle
        uses: actions/upload-artifact@v4
        with:
          # Publisher identity: linux-static-<commit>-<run_id>-<run_attempt>.
          name: linux-static-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/linux-static/
          if-no-files-found: error

  e2e-measurement:
    name: E2E measured token savings (E2E_LLM=1, real OpenCode)
    needs: quality-gates
    if: vars.E2E_LLM_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      E2E_LLM: "1"
      E2E_WORKER_API_URL: ${{ secrets.E2E_WORKER_API_URL }}
      E2E_WORKER_MODEL: ${{ secrets.E2E_WORKER_MODEL }}
      E2E_WORKER_API_KEY: ${{ secrets.E2E_WORKER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.1 (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install OpenCode CLI
        run: curl -fsSL https://opencode.ai/install | bash
      - name: Run the E2E measurement suite (compose stack + scripted OpenCode sessions, baseline vs mmhmem)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: cargo test --test e2e_measurement
      - name: Upload measured-savings report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-measurement-report
          path: target/e2e/**/report.md
          if-no-files-found: ignore

  windows:
    name: Windows x64 - clippy, deterministic tests, release build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell installer regression checks
        shell: powershell
        run: ./scripts/test-install.ps1
      - name: Install Rust 1.98.1 (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Restore cargo registry and target (prefix fallback survives version-only lockfile changes)
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-1.98.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-windows-1.98.1-
      - name: Blocking clippy (same strictness as the Linux gate)
        run: cargo clippy --all-targets -- -D warnings
      - name: Deterministic test suite
        run: cargo test
      - name: Release build (x86_64-pc-windows-msvc)
        run: cargo build --release --locked
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: mmhmem-x86_64-pc-windows-msvc
          path: target/release/mmhmem.exe
          if-no-files-found: error
      # success(): a failed build never persists its target dir.
      # Push-only, so pull requests cannot overwrite main's caches.
      - name: Save cargo registry and target (only without an exact hit)
        if: success() && github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Report cargo cache status
        if: always()
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.cargo-cache.outputs.cache-matched-key }}
        run: |
          if ($env:CACHE_HIT -eq 'true') { $status = 'exact' }
          elseif ($env:CACHE_MATCHED_KEY) { $status = "fallback ($env:CACHE_MATCHED_KEY)" }
          else { $status = 'miss' }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Native cargo cache (windows): $status"

  macos:
    name: macOS aarch64 and x86_64 - clippy, deterministic tests, release builds
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.1 (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Add the x86_64-apple-darwin target
        run: rustup target add x86_64-apple-darwin
      - name: Restore cargo registry and target (prefix fallback survives version-only lockfile changes)
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos-1.98.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-macos-1.98.1-
      - name: Blocking clippy (same strictness as the Linux gate)
        run: cargo clippy --all-targets -- -D warnings
      - name: Deterministic test suite
        run: cargo test
      - name: Release build (aarch64-apple-darwin, native)
        run: cargo build --release --locked
      - name: Release build (x86_64-apple-darwin, cross)
        run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: mmhmem-macos
          path: |
            target/release/mmhmem
            target/x86_64-apple-darwin/release/mmhmem
          if-no-files-found: error
      # success(): a failed build never persists its target dir.
      # Push-only, so pull requests cannot overwrite main's caches.
      - name: Save cargo registry and target (only without an exact hit)
        if: success() && github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Report cargo cache status
        if: always()
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.cargo-cache.outputs.cache-matched-key }}
        run: |
          if [ "$CACHE_HIT" = 'true' ]; then status='exact'
          elif [ -n "$CACHE_MATCHED_KEY" ]; then status="fallback ($CACHE_MATCHED_KEY)"
          else status='miss'
          fi
          printf 'Native cargo cache (macos): %s\n' "$status" >> "$GITHUB_STEP_SUMMARY"
